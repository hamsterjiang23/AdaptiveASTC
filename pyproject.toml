[project]
name = "adaptive-astc"
version = "0.1.0"
description = "Reproducible ASTC footprint classification and calibration experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.8.0",
  "torchvision==0.23.0",
  "numpy>=2.2,<3",
  "pillow>=11.3,<13",
  "scikit-learn>=1.7,<2",
  "scipy>=1.15,<2",
  "imagehash>=4.3.2,<5",
  "pycryptodome>=3.23,<4",
  "psutil>=7,<8",
  "matplotlib>=3.10,<4",
]

[project.scripts]
adaptive-astc = "adaptive_astc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "basedpyright>=1.31,<2"]

[tool.uv]
cache-dir = ".cache/uv"
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_astc"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN"]
ignore = ["ANN401"]

[tool.basedpyright]
typeCheckingMode = "basic"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
