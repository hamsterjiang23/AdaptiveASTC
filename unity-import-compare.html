<script>
(() => {
  const root = document.getElementById("unity-import-compare");
  const pairs = JSON.parse(document.getElementById("unity-import-pairs").textContent);
  const select = root.querySelector("[data-case]");
  const toggle = root.querySelector("[data-alpha]");
  const checkbox = toggle.querySelector("input");
  const images = root.querySelectorAll("img");
  const labels = root.querySelectorAll("figcaption");
  const notes = {
    size: "两张图均缩放到 224×224 对比",
    alpha: "最近邻放大，保留原始像素边界",
    jpeg: "两张图裁取同一块 224×224 区域"
  };
  function render() {
    const key = select.value;
    const pair = pairs[key];
    toggle.hidden = !pair.alpha;
    const previews = pair.alpha && checkbox.checked ? pair.alpha : pair.images;
    images[0].src = previews[0];
    images[1].src = previews[1];
    images[2].src = pair.diff;
    labels[0].textContent = "原图 · " + pair.sizes[0].join("×");
    labels[1].textContent = "Unity · " + pair.sizes[1].join("×");
    labels[2].textContent = "RGB 差异" + (pair.gain > 1 ? " · 放大 " + pair.gain + " 倍" : "");
    root.querySelector("[data-caption]").textContent = pair.name + " · " + notes[key];
  }
  select.addEventListener("change", render);
  checkbox.addEventListener("change", render);
  render();
})();
</script>
